<!doctype html>
<!-- Open Graph card (1200×630). Rendered by scripts/make-og.sh. Colors and fonts come from the site's own tokens. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/montserrat/wght.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--black);
      }

      /* Shaun's portrait (the one in About) on the right, so the name on the left never covers the face */
      .photo {
        position: absolute;
        top: 0;
        right: 0;
        width: 640px;
        height: 630px;
        object-fit: cover;
        object-position: 50% 40%;
      }

      /* Fades the photo's left edge into the black, and darkens it a little */
      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, var(--black) 47%, color-mix(in srgb, var(--black) 30%, transparent) 70%, color-mix(in srgb, var(--black) 20%, transparent)),
          linear-gradient(to top, color-mix(in srgb, var(--black) 50%, transparent), transparent 45%);
      }

      .text {
        position: absolute;
        left: 72px;
        bottom: 80px;
      }

      h1 {
        margin: 0 0 24px;
        font-family: var(--font);
        font-size: 112px;
        font-weight: 700;
        line-height: 0.92;
        letter-spacing: var(--tracking-tighter);
        text-transform: uppercase;
        color: var(--text);
      }

      h1 span {
        display: block;
      }

      p {
        margin: 0;
        font-family: var(--font);
        font-size: 22px;
        font-weight: 500;
        letter-spacing: var(--tracking-widest);
        text-transform: uppercase;
        color: var(--text-80);
      }
    </style>
  </head>
  <body>
    <img class="photo" src="../../src/assets/photos/shaun-retrato.jpg" alt="" />
    <div class="shade"></div>
    <div class="text">
      <h1><span>Shaun</span><span>Nolanh</span></h1>
      <p>Progressive House · Deep House · Organic House</p>
    </div>
  </body>
</html>
